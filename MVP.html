<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор занятий техникума (MVP)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f2f4f8;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        /* табы */
        .tabs {
            display: flex;
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 20px;
            gap: 8px;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            color: #4a5568;
            transition: all 0.2s;
            border-radius: 12px 12px 0 0;
        }
        .tab-btn.active {
            color: #2b6cb0;
            background: #ebf8ff;
            border-bottom: 3px solid #2b6cb0;
        }
        .tab-content {
            display: none;
            padding: 24px;
        }
        .tab-content.active {
            display: block;
        }
        /* карточки и сетка */
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 16px;
            width: 280px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: 0.1s;
        }
        .card h3 {
            margin-top: 0;
            font-size: 1.25rem;
        }
        .card p {
            margin: 6px 0;
            font-size: 0.9rem;
            color: #2d3748;
        }
        .badge {
            background: #e2e8f0;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            display: inline-block;
            margin-right: 6px;
            margin-top: 8px;
        }
        .card-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }
        button {
            background: #edf2f7;
            border: none;
            padding: 6px 12px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: 0.1s;
        }
        button.primary {
            background: #2b6cb0;
            color: white;
        }
        button.danger {
            color: #c53030;
        }
        form {
            background: #f7fafc;
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
        }
        input, select {
            padding: 8px 12px;
            border-radius: 40px;
            border: 1px solid #cbd5e0;
            background: white;
            min-width: 160px;
        }
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
        }
        hr {
            margin: 24px 0;
        }
        .export-btn {
            background: #38a169;
            color: white;
            margin-right: 8px;
        }
        textarea, .full-width {
            width: 100%;
        }
        .inline-badge {
            background: #bee3f8;
            border-radius: 16px;
            padding: 2px 10px;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="tabs">
        <button class="tab-btn active" data-tab="teachers">Преподаватели</button>
        <button class="tab-btn" data-tab="rooms">Кабинеты</button>
        <button class="tab-btn" data-tab="lessontypes">Типы занятий</button>
        <button class="tab-btn" data-tab="constructor">Конструктор</button>
    </div>

    <!-- Преподаватели -->
    <div id="teachers" class="tab-content active">
        <h2>Преподаватели</h2>
        <form id="teacherForm">
            <input type="hidden" id="teacherId">
            <div class="form-group"><label>ФИО</label><input id="teacherName" required></div>
            <div class="form-group"><label>Дисциплина</label><input id="teacherDiscipline" required></div>
            <div class="form-group"><label>Кабинет (по умолч.)</label><select id="teacherRoom"></select></div>
            <div class="form-group"><label>Специальность</label><select id="teacherSpec"><option value="экологи">экологи</option><option value="программисты">программисты</option></select></div>
            <button type="submit" class="primary">Сохранить</button>
            <button type="button" id="cancelTeacher">Отмена</button>
        </form>
        <div class="filter-bar">
            <input type="text" id="teacherSearch" placeholder="Поиск по ФИО">
            <input type="text" id="teacherFilterDisc" placeholder="Фильтр по дисциплине">
            <select id="teacherFilterSpec"><option value="">Все специальности</option><option>экологи</option><option>программисты</option></select>
        </div>
        <div id="teachersList" class="grid"></div>
    </div>

    <!-- Кабинеты -->
    <div id="rooms" class="tab-content">
        <h2>Кабинеты</h2>
        <form id="roomForm">
            <input type="hidden" id="roomId">
            <div class="form-group"><label>Номер</label><input id="roomNumber" required></div>
            <div class="form-group"><label>Название</label><input id="roomName"></div>
            <div class="form-group"><label>Вместимость</label><input id="roomCapacity" type="number"></div>
            <div class="form-group"><label>Тип</label><select id="roomType"><option>лекция</option><option>практика</option></select></div>
            <div class="form-group"><label>Оборудование</label><input id="roomEquipment"></div>
            <button type="submit" class="primary">Сохранить</button>
        </form>
        <div class="filter-bar"><input id="roomSearch" placeholder="По номеру/названию"><select id="roomTypeFilter"><option value="">Все типы</option><option>лекция</option><option>практика</option></select><input type="number" id="roomMinCap" placeholder="Мин. вместимость"></div>
        <div id="roomsList" class="grid"></div>
    </div>

    <!-- Типы занятий -->
    <div id="lessontypes" class="tab-content">
        <h2>Типы занятий (дисциплины)</h2>
        <form id="lessonTypeForm">
            <input type="hidden" id="lessonTypeId">
            <div class="form-group"><label>Название</label><input id="ltName" required></div>
            <div class="form-group"><label>Код</label><input id="ltCode"></div>
            <div class="form-group"><label>Нормативная нагрузка (часы)</label><input id="ltHours" type="number"></div>
            <div class="form-group"><label>Специальность</label><select id="ltSpec"><option>экологи</option><option>программисты</option></select></div>
            <button type="submit" class="primary">Сохранить</button>
        </form>
        <div class="filter-bar"><input id="ltSearch" placeholder="Название/код"><select id="ltSpecFilter"><option value="">Все спец.</option><option>экологи</option><option>программисты</option></select></div>
        <div id="lessonTypesList" class="grid"></div>
    </div>

    <!-- Конструктор -->
    <div id="constructor" class="tab-content">
        <h2>Конструктор занятий (связки)</h2>
        <div class="filter-bar">
            <label>Фильтр по специальности: </label>
            <select id="constrSpecFilter"><option value="">Все</option><option>экологи</option><option>программисты</option></select>
            <button id="exportCsvBtn" class="export-btn">📎 Экспорт CSV</button>
        </div>
        <form id="constraintForm">
            <input type="hidden" id="constructionId">
            <div class="form-group"><label>Преподаватель</label><select id="constrTeacher" required></select></div>
            <div class="form-group"><label>Кабинет</label><select id="constrRoom" required></select></div>
            <div class="form-group"><label>Тип занятия</label><select id="constrType" required></select></div>
            <div class="form-group"><label>Длительность (часы в день)</label><input id="constrDuration" type="number" step="1" required></div>
            <button type="submit" class="primary">Создать/Обновить</button>
            <button type="button" id="cancelConst">Отмена</button>
        </form>
        <div id="constructionsList" class="grid"></div>
        <hr>
        <div><h3>Просмотр конструкций по объекту</h3>
            <div class="filter-bar">
                <select id="filterByTeacher"><option value="">Все преподаватели</option></select>
                <select id="filterByRoom"><option value="">Все кабинеты</option></select>
                <select id="filterByType"><option value="">Все типы занятий</option></select>
            </div>
            <div id="filteredConstructions" class="grid"></div>
        </div>
    </div>
</div>

<script>
    // ----- Хранилища -----
    let teachers = [];
    let rooms = [];
    let lessonTypes = [];
    let constructions = [];

    // --- инициализация тестовых данных ---
    function initData() {
        if (!localStorage.getItem('teachers')) {
            teachers = [
                { id: "t1", name: "Петрова Анна Ивановна", discipline: "Экология", defaultRoomId: "r1", speciality: "экологи" },
                { id: "t2", name: "Сидоров Игорь Петрович", discipline: "Программирование", defaultRoomId: "r2", speciality: "программисты" }
            ];
            rooms = [
                { id: "r1", number: "101", name: "Лекционная", capacity: 30, type: "лекция", equipment: "проектор" },
                { id: "r2", number: "202", name: "Компьютерный класс", capacity: 15, type: "практика", equipment: "ПК" }
            ];
            lessonTypes = [
                { id: "lt1", name: "Общая экология", code: "EC-01", hours: 72, speciality: "экологи" },
                { id: "lt2", name: "Базы данных", code: "DB-01", hours: 64, speciality: "программисты" }
            ];
            constructions = [
                { id: "c1", teacherId: "t1", roomId: "r1", lessonTypeId: "lt1", duration: 2 },
                { id: "c2", teacherId: "t2", roomId: "r2", lessonTypeId: "lt2", duration: 3 }
            ];
            saveAll();
        } else {
            loadAll();
        }
    }
    function loadAll() {
        teachers = JSON.parse(localStorage.getItem('teachers')) || [];
        rooms = JSON.parse(localStorage.getItem('rooms')) || [];
        lessonTypes = JSON.parse(localStorage.getItem('lessonTypes')) || [];
        constructions = JSON.parse(localStorage.getItem('constructions')) || [];
    }
    function saveAll() {
        localStorage.setItem('teachers', JSON.stringify(teachers));
        localStorage.setItem('rooms', JSON.stringify(rooms));
        localStorage.setItem('lessonTypes', JSON.stringify(lessonTypes));
        localStorage.setItem('constructions', JSON.stringify(constructions));
    }
    // helpers
    function getRoomById(id) { return rooms.find(r => r.id === id); }
    function getTeacherById(id) { return teachers.find(t => t.id === id); }
    function getLessonTypeById(id) { return lessonTypes.find(l => l.id === id); }

    // --- UI рендер ---
    function renderTeachers() {
        let list = [...teachers];
        const search = document.getElementById('teacherSearch').value.toLowerCase();
        const discFilter = document.getElementById('teacherFilterDisc').value.toLowerCase();
        const specFilter = document.getElementById('teacherFilterSpec').value;
        if (search) list = list.filter(t => t.name.toLowerCase().includes(search));
        if (discFilter) list = list.filter(t => t.discipline.toLowerCase().includes(discFilter));
        if (specFilter) list = list.filter(t => t.speciality === specFilter);
        const container = document.getElementById('teachersList');
        container.innerHTML = list.map(t => `
            <div class="card">
                <h3>${escapeHtml(t.name)}</h3>
                <p><strong>Дисциплина:</strong> ${escapeHtml(t.discipline)}</p>
                <p>Кабинет: ${getRoomById(t.defaultRoomId)?.number || 'не задан'}</p>
                <p>Специальность: ${t.speciality}</p>
                <div class="card-actions">
                    <button onclick="editTeacher('${t.id}')">Ред.</button>
                    <button class="danger" onclick="deleteTeacher('${t.id}')">Удалить</button>
                </div>
            </div>
        `).join('');
        // заполнить select кабинетов в форме
        const selectRoom = document.getElementById('teacherRoom');
        selectRoom.innerHTML = rooms.map(r => `<option value="${r.id}">${r.number} - ${r.name}</option>`).join('');
    }
    function renderRooms() {
        let list = [...rooms];
        const search = document.getElementById('roomSearch').value.toLowerCase();
        const typeFilter = document.getElementById('roomTypeFilter').value;
        const minCap = parseInt(document.getElementById('roomMinCap').value);
        if (search) list = list.filter(r => r.number.toLowerCase().includes(search) || r.name.toLowerCase().includes(search));
        if (typeFilter) list = list.filter(r => r.type === typeFilter);
        if (minCap) list = list.filter(r => r.capacity >= minCap);
        document.getElementById('roomsList').innerHTML = list.map(r => `
            <div class="card"><h3>${escapeHtml(r.number)}</h3><p>${escapeHtml(r.name)}</p><p>Вместимость: ${r.capacity}</p><p>Тип: ${r.type}</p><p>Оборудование: ${escapeHtml(r.equipment)}</p>
            <button onclick="editRoom('${r.id}')">Ред.</button>
            <button class="danger" onclick="deleteRoom('${r.id}')">Удалить</button></div>
        `).join('');
    }
    function renderLessonTypes() {
        let list = [...lessonTypes];
        const search = document.getElementById('ltSearch').value.toLowerCase();
        const specFilter = document.getElementById('ltSpecFilter').value;
        if (search) list = list.filter(lt => lt.name.toLowerCase().includes(search) || lt.code.toLowerCase().includes(search));
        if (specFilter) list = list.filter(lt => lt.speciality === specFilter);
        document.getElementById('lessonTypesList').innerHTML = list.map(lt => `
            <div class="card"><h3>${escapeHtml(lt.name)}</h3><p>Код: ${lt.code}</p><p>Часов: ${lt.hours}</p><p>Специальность: ${lt.speciality}</p>
            <button onclick="editLessonType('${lt.id}')">Ред.</button>
            <button class="danger" onclick="deleteLessonType('${lt.id}')">Удалить</button></div>
        `).join('');
    }
    function renderConstructions() {
        const specFilter = document.getElementById('constrSpecFilter').value;
        let filtered = [...constructions];
        if (specFilter) {
            filtered = filtered.filter(c => {
                const teacher = getTeacherById(c.teacherId);
                const type = getLessonTypeById(c.lessonTypeId);
                return teacher?.speciality === specFilter || type?.speciality === specFilter;
            });
        }
        const container = document.getElementById('constructionsList');
        container.innerHTML = filtered.map(c => {
            const teacher = getTeacherById(c.teacherId);
            const room = getRoomById(c.roomId);
            const ltype = getLessonTypeById(c.lessonTypeId);
            return `<div class="card"><h3>${teacher?.name || '?'}</h3><p>Каб: ${room?.number || '?'} (${room?.name || '?'})</p><p>Тип: ${ltype?.name || '?'}</p><p>Длительность: ${c.duration} ч/день</p>
            <button onclick="editConstruction('${c.id}')">Ред.</button>
            <button class="danger" onclick="deleteConstruction('${c.id}')">Удалить</button></div>`;
        }).join('');
        // заполнить выпадающие списки формы конструктора с учётом спец фильтра?
        updateConstructorSelects(specFilter);
        renderFilteredByObjects();
    }
    function updateConstructorSelects(specFilter) {
        let teacherOptions = teachers;
        let typeOptions = lessonTypes;
        if (specFilter) {
            teacherOptions = teachers.filter(t => t.speciality === specFilter);
            typeOptions = lessonTypes.filter(lt => lt.speciality === specFilter);
        }
        const teacherSel = document.getElementById('constrTeacher');
        teacherSel.innerHTML = teacherOptions.map(t => `<option value="${t.id}">${t.name} (${t.speciality})</option>`).join('');
        const roomSel = document.getElementById('constrRoom');
        roomSel.innerHTML = rooms.map(r => `<option value="${r.id}">${r.number} - ${r.name}</option>`).join('');
        const typeSel = document.getElementById('constrType');
        typeSel.innerHTML = typeOptions.map(lt => `<option value="${lt.id}">${lt.name} [${lt.speciality}]</option>`).join('');
    }
    function renderFilteredByObjects() {
        const teacherId = document.getElementById('filterByTeacher').value;
        const roomId = document.getElementById('filterByRoom').value;
        const typeId = document.getElementById('filterByType').value;
        let filtered = constructions;
        if (teacherId) filtered = filtered.filter(c => c.teacherId === teacherId);
        if (roomId) filtered = filtered.filter(c => c.roomId === roomId);
        if (typeId) filtered = filtered.filter(c => c.lessonTypeId === typeId);
        const container = document.getElementById('filteredConstructions');
        if(filtered.length===0){ container.innerHTML='<p>Нет конструкций</p>'; return; }
        container.innerHTML = filtered.map(c => `<div class="card"><small>${getTeacherById(c.teacherId)?.name}</small> / ${getRoomById(c.roomId)?.number} / ${getLessonTypeById(c.lessonTypeId)?.name} — ${c.duration}ч</div>`).join('');
    }
    function populateFilterSelects() {
        const teacherSelect = document.getElementById('filterByTeacher');
        teacherSelect.innerHTML = '<option value="">Все преподаватели</option>' + teachers.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
        const roomSelect = document.getElementById('filterByRoom');
        roomSelect.innerHTML = '<option value="">Все кабинеты</option>' + rooms.map(r=>`<option value="${r.id}">${r.number}</option>`).join('');
        const typeSelect = document.getElementById('filterByType');
        typeSelect.innerHTML = '<option value="">Все типы</option>' + lessonTypes.map(lt=>`<option value="${lt.id}">${lt.name}</option>`).join('');
    }

    // CRUD операции
    window.editTeacher = (id) => {
        const t = teachers.find(t => t.id === id);
        document.getElementById('teacherId').value = t.id;
        document.getElementById('teacherName').value = t.name;
        document.getElementById('teacherDiscipline').value = t.discipline;
        document.getElementById('teacherRoom').value = t.defaultRoomId;
        document.getElementById('teacherSpec').value = t.speciality;
    };
    window.deleteTeacher = (id) => { if(confirm('Удалить?')){ teachers = teachers.filter(t=>t.id!==id); constructions = constructions.filter(c=>c.teacherId!==id); saveAll(); renderAll(); }};
    window.editRoom = (id) => { const r = rooms.find(r=>r.id===id); document.getElementById('roomId').value=r.id; document.getElementById('roomNumber').value=r.number; document.getElementById('roomName').value=r.name; document.getElementById('roomCapacity').value=r.capacity; document.getElementById('roomType').value=r.type; document.getElementById('roomEquipment').value=r.equipment; };
    window.deleteRoom = (id) => { if(confirm('Удалить кабинет?')){ rooms = rooms.filter(r=>r.id!==id); constructions = constructions.filter(c=>c.roomId!==id); saveAll(); renderAll(); }};
    window.editLessonType = (id) => { const lt=lessonTypes.find(l=>l.id===id); document.getElementById('lessonTypeId').value=lt.id; document.getElementById('ltName').value=lt.name; document.getElementById('ltCode').value=lt.code; document.getElementById('ltHours').value=lt.hours; document.getElementById('ltSpec').value=lt.speciality; };
    window.deleteLessonType = (id) => { if(confirm('Удалить тип занятия?')){ lessonTypes = lessonTypes.filter(l=>l.id!==id); constructions = constructions.filter(c=>c.lessonTypeId!==id); saveAll(); renderAll(); }};
    window.editConstruction = (id) => {
        const c = constructions.find(c=>c.id===id);
        document.getElementById('constructionId').value = c.id;
        document.getElementById('constrTeacher').value = c.teacherId;
        document.getElementById('constrRoom').value = c.roomId;
        document.getElementById('constrType').value = c.lessonTypeId;
        document.getElementById('constrDuration').value = c.duration;
    };
    window.deleteConstruction = (id) => { if(confirm('Удалить конструкцию?')){ constructions = constructions.filter(c=>c.id!==id); saveAll(); renderAll(); }};
    function escapeHtml(str) { return (str||'').replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    // Сохранение форм
    document.getElementById('teacherForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const id = document.getElementById('teacherId').value;
        const newTeacher = {
            id: id || 't'+Date.now(),
            name: document.getElementById('teacherName').value,
            discipline: document.getElementById('teacherDiscipline').value,
            defaultRoomId: document.getElementById('teacherRoom').value,
            speciality: document.getElementById('teacherSpec').value
        };
        if(id){ const idx = teachers.findIndex(t=>t.id===id); teachers[idx]=newTeacher; }
        else teachers.push(newTeacher);
        saveAll(); renderAll();
        document.getElementById('teacherForm').reset(); document.getElementById('teacherId').value='';
    });
    document.getElementById('roomForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const id = document.getElementById('roomId').value;
        const room = { id: id||'r'+Date.now(), number: document.getElementById('roomNumber').value, name: document.getElementById('roomName').value, capacity: parseInt(document.getElementById('roomCapacity').value), type: document.getElementById('roomType').value, equipment: document.getElementById('roomEquipment').value };
        if(id){ const idx = rooms.findIndex(r=>r.id===id); rooms[idx]=room; }
        else rooms.push(room);
        saveAll(); renderAll();
    });
    document.getElementById('lessonTypeForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const id = document.getElementById('lessonTypeId').value;
        const lt = { id:id||'lt'+Date.now(), name: document.getElementById('ltName').value, code: document.getElementById('ltCode').value, hours: parseInt(document.getElementById('ltHours').value), speciality: document.getElementById('ltSpec').value };
        if(id){ const idx = lessonTypes.findIndex(l=>l.id===id); lessonTypes[idx]=lt; }
        else lessonTypes.push(lt);
        saveAll(); renderAll();
    });
    document.getElementById('constraintForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const id = document.getElementById('constructionId').value;
        const teacherId = document.getElementById('constrTeacher').value;
        const roomId = document.getElementById('constrRoom').value;
        const lessonTypeId = document.getElementById('constrType').value;
        const duration = parseInt(document.getElementById('constrDuration').value);
        // проверка дублирования
        const duplicate = constructions.some(c => c.id !== id && c.teacherId === teacherId && c.roomId === roomId && c.lessonTypeId === lessonTypeId && c.duration === duration);
        if(duplicate){ alert('Такая конструкция уже существует!'); return; }
        if(id){ const idx = constructions.findIndex(c=>c.id===id); constructions[idx] = { ...constructions[idx], teacherId, roomId, lessonTypeId, duration }; }
        else constructions.push({ id:'c'+Date.now(), teacherId, roomId, lessonTypeId, duration });
        saveAll(); renderAll();
        document.getElementById('constraintForm').reset(); document.getElementById('constructionId').value='';
    });
    document.getElementById('cancelTeacher').onclick = () => { document.getElementById('teacherForm').reset(); document.getElementById('teacherId').value=''; };
    document.getElementById('cancelConst').onclick = () => { document.getElementById('constraintForm').reset(); document.getElementById('constructionId').value=''; };
    document.getElementById('exportCsvBtn').onclick = () => {
        let data = constructions.map(c => {
            const t = getTeacherById(c.teacherId);
            const r = getRoomById(c.roomId);
            const lt = getLessonTypeById(c.lessonTypeId);
            return `${t?.name||''},${r?.number||''},${lt?.name||''},${c.duration}`;
        });
        const csv = "Преподаватель,Кабинет,Тип занятия,Длительность(ч)\n"+data.join("\n");
        const blob = new Blob([csv], {type: 'text/csv'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'constructions.csv'; a.click();
    };
    function bindFilters() {
        document.getElementById('teacherSearch').addEventListener('input', ()=>renderTeachers());
        document.getElementById('teacherFilterDisc').addEventListener('input', ()=>renderTeachers());
        document.getElementById('teacherFilterSpec').addEventListener('change', ()=>renderTeachers());
        document.getElementById('roomSearch').addEventListener('input', ()=>renderRooms());
        document.getElementById('roomTypeFilter').addEventListener('change', ()=>renderRooms());
        document.getElementById('roomMinCap').addEventListener('input', ()=>renderRooms());
        document.getElementById('ltSearch').addEventListener('input', ()=>renderLessonTypes());
        document.getElementById('ltSpecFilter').addEventListener('change', ()=>renderLessonTypes());
        document.getElementById('constrSpecFilter').addEventListener('change', ()=>renderConstructions());
        document.getElementById('filterByTeacher').addEventListener('change', ()=>renderFilteredByObjects());
        document.getElementById('filterByRoom').addEventListener('change', ()=>renderFilteredByObjects());
        document.getElementById('filterByType').addEventListener('change', ()=>renderFilteredByObjects());
    }
    function renderAll() {
        renderTeachers(); renderRooms(); renderLessonTypes(); renderConstructions(); populateFilterSelects();
    }
    // tabs
    function setupTabs() {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                const tabId = btn.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(tab=>tab.classList.remove('active'));
                document.getElementById(tabId).classList.add('active');
                if(tabId === 'constructor') renderConstructions();
                else if(tabId === 'teachers') renderTeachers();
                else if(tabId === 'rooms') renderRooms();
                else if(tabId === 'lessontypes') renderLessonTypes();
            });
        });
    }
    initData(); setupTabs(); bindFilters(); populateFilterSelects(); renderAll();
</script>
</body>
</html>
